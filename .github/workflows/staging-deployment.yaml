name: Deploy to Staging
# Triggers every Wednesday at 12:00 UTC, or manually.
# Assumes PRs have already been merged into main before this runs.
on:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 12 * * 3"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version for production"
        required: true
        default: "v1.0.0"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: adept-technologies/ideahub

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  # ============================================================
  # 1. BUILD & PUSH DOCKER IMAGE (tagged with commit SHA)
  #    Runs on GitHub's cloud runner — needs internet access to
  #    push to GHCR. Self-hosted runner not needed here.
  # ============================================================
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    outputs:
      sha_short: ${{ steps.meta.outputs.sha_short }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
      pkg_version: ${{ steps.pkg.outputs.version }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Extract version from package.json
        id: pkg
        run: |
          VERSION=$(node -p "require('./ui/package.json').version")
          echo "version=v$VERSION" >> $GITHUB_OUTPUT

      - name: Compute short SHA
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          echo "image_ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:$SHA_SHORT" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ${{ steps.meta.outputs.image_ref }} .

      - name: Push image to GHCR
        run: |
          docker push ${{ steps.meta.outputs.image_ref }}

  # ============================================================
  # 2. DEPLOY TO STAGING
  #    Runs on the self-hosted runner installed on the staging
  #    server. No SSH needed — commands run directly on the
  #    server. The runner must be installed and online first.
  # ============================================================
  deploy-staging:
    name: Deploy to Staging Server
    runs-on: [ self-hosted, staging ]
    needs: build-and-push

    steps:
      - name: Log in to Docker Hub
        # Required so Compose can pull postgres:15 without hitting
        # Docker Hub's rate limit or anonymous pull restrictions
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin

      - name: Pull image
        run: |
          docker pull "${{ needs.build-and-push.outputs.image_ref }}"

      - name: Deploy with Docker Compose
        run: |
          cd /opt/ideahub
          IMAGE_REF=${{ needs.build-and-push.outputs.image_ref }} \
            docker compose --env-file /etc/ideahub/staging.env up -d

      - name: Confirm deployment
        run: |
          echo "Staging deployment complete: ${{ needs.build-and-push.outputs.image_ref }}"

  # ============================================================
  # 3. SMOKE TESTS
  #    Also runs on the self-hosted runner so it can reach
  #    localhost on the staging server directly.
  # ============================================================
  smoke-tests:
    name: Smoke Tests on Staging
    runs-on: [ self-hosted, staging ]
    needs: deploy-staging

    steps:
      - name: Wait for containers to be ready
        # 30s gives the database time to pass its healthcheck and
        # the .NET app time to fully initialise before curl hits it
        run: sleep 30

      - name: Check backend container status
        run: |
          STATUS=$(docker inspect --format='{{.State.Status}}' ideahub-backend 2>/dev/null || echo "not found")
          echo "Container status: $STATUS"

          if [ "$STATUS" != "running" ]; then
            echo "Backend container is not running. Aborting."
            docker compose -f /opt/ideahub/docker-compose.yml logs ideahub-backend
            exit 1
          fi

      - name: Print container logs
        # Print last 70 lines so startup errors and listening port
        # are always visible in the Actions run
        run: docker logs ideahub-backend --tail 70

      - name: Health check
        run: |
          curl --fail --retry 10 --retry-delay 5 http://localhost:5065/health \
            && echo "Health check passed" \
            || (echo "Health check failed" && exit 1)

  # ============================================================
  # 4. OWASP ZAP DAST SCAN
  #    Runs on the self-hosted runner to scan the application
  #    actively running on localhost:5065.
  # ============================================================
  zap-scan:
    name: OWASP ZAP Authenticated Scan
    runs-on: [ self-hosted, staging ]
    needs: smoke-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Obtain Auth0 Token for ZAP Scanning
        id: auth
        run: |
          # Use Auth0 Resource Owner Password Grant (ROPG) to get a real Auth0 token.
          # This ensures ZAP scans with a token the backend actually accepts,
          # allowing it to reach all protected endpoints behind [Authorize].
          RESPONSE=$(curl -s -X POST "https://${{ secrets.AUTH0_DOMAIN }}/oauth/token" \
            -H "Content-Type: application/json" \
            -d "{\
              \"grant_type\": \"password\",\
              \"username\": \"${{ secrets.STAGING_ZAP_USER }}\",\
              \"password\": \"${{ secrets.STAGING_ZAP_PASSWORD }}\",\
              \"audience\": \"https://api.ideahub\",\
              \"client_id\": \"${{ secrets.AUTH0_CLIENT_ID }}\",\
              \"client_secret\": \"${{ secrets.AUTH0_CLIENT_SECRET }}\",\
              \"scope\": \"openid profile email\"\
            }")

          TOKEN=$(echo $RESPONSE | jq -r '.access_token')

          if [ "$TOKEN" == "null" ] || [ -z "$TOKEN" ]; then
            echo "Failed to obtain Auth0 token. Response: $RESPONSE"
            exit 1
          fi

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT

      - name: Create ZAP Auth Hook (on-the-fly)
        run: |
          echo "def zap_started(zap, target):" > zap-hooks.py
          echo "    zap.openapi.import_url('http://localhost:5065/openapi/v1.json')" >> zap-hooks.py
          echo "" >> zap-hooks.py
          echo "def sending_request(zap, msg, is_sender_wildcard):" >> zap-hooks.py
          echo "    import os" >> zap-hooks.py
          echo "    token = os.environ.get('ZAP_AUTH_HEADER_VALUE')" >> zap-hooks.py
          echo "    if token:" >> zap-hooks.py
          echo "        msg.getRequestHeader().setHeader('Authorization', token)" >> zap-hooks.py
          echo "    return msg" >> zap-hooks.py
          
      - name: Run ZAP Full Scan (with OpenAPI & Hooks)
        run: |
          docker run --rm --network="host" \
            -v $(pwd):/zap/wrk/:rw \
            -e ZAP_AUTH_HEADER_VALUE="Bearer ${{ steps.auth.outputs.token }}" \
            zaproxy/zap-stable zap-full-scan.py \
            -t http://localhost:5065 \
            -I \
            -c /zap/wrk/zap.conf \
            --hook /zap/wrk/zap-hooks.py \
            -r zap_report.html \
            -J report_json.json

      - name: Upload ZAP HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-scan-report
          path: zap_report.html

      - name: Convert ZAP JSON to SARIF
        if: always()
        run: |
          python3 - <<'EOF'
          import json, sys
          from urllib.parse import urlparse
          try:
              with open("report_json.json") as f:
                  zap = json.load(f)
          except FileNotFoundError:
              print("report_json.json not found — ZAP may not have completed. Writing empty SARIF.")
              zap = {"site": []}

          results = []
          for site in zap.get("site", []):
              for alert in site.get("alerts", []):
                  for instance in alert.get("instances", [{"uri": site.get("@name",""), "method":"","param":"","evidence":""}]):
                      raw_uri = instance.get("uri", "")
                      parsed = urlparse(raw_uri)
                      relative_uri = parsed.path.lstrip("/") or "index"
                      results.append({
                          "ruleId": str(alert.get("pluginid", "0")),
                          "message": {"text": alert.get("desc", alert.get("name", ""))},
                          "locations": [{"physicalLocation": {"artifactLocation": {"uri": relative_uri}}}],
                          "level": {"High":"error","Medium":"warning","Low":"note","Informational":"none"}.get(alert.get("riskdesc","").split(" ")[0], "none")
                      })

          sarif = {
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              "version": "2.1.0",
              "runs": [{"tool": {"driver": {"name": "OWASP ZAP", "rules": []}}, "results": results}]
          }
          with open("results.sarif", "w") as f:
              json.dump(sarif, f, indent=2)
          print(f"SARIF written with {len(results)} results.")
          EOF

      - name: Upload ZAP Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
          category: zap


  # ============================================================
  # 5. MANUAL APPROVAL GATE

  #    The workflow pauses here. GitHub emails all required
  #    reviewers configured on the staging-approval Environment.
  #    Nothing proceeds until a reviewer clicks Approve in the
  #    GitHub Actions UI.
  #
  #    To set this up:
  #    Repo > Settings > Environments > staging-approval
  #    > Protection rules > Required reviewers > add your team
  # ============================================================
  await-approval:
    name: Await Team Approval
    runs-on: ubuntu-latest
    needs: [build-and-push, smoke-tests, zap-scan]
    environment: staging-approval

    steps:
      - name: Log approved deployment details
        env:
          SAFE_SHA: ${{ needs.build-and-push.outputs.sha_short }}
          SAFE_IMAGE: ${{ needs.build-and-push.outputs.image_ref }}
          SAFE_VERSION: ${{ inputs.version || 'not specified — push or schedule trigger' }}
        run: |
          echo "Staging approved. Triggering prod deployment..."
          echo "SHA: $SAFE_SHA"
          echo "Image: $SAFE_IMAGE"
          echo "Version: $SAFE_VERSION"

      - name: Trigger production deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DEPLOY_PAT }}
          event-type: deploy-prod
          client-payload: |
            {
              "sha_short": "${{ needs.build-and-push.outputs.sha_short }}",
              "image_ref": "${{ needs.build-and-push.outputs.image_ref }}",
              "version": "${{ inputs.version || needs.build-and-push.outputs.pkg_version }}"
            }
