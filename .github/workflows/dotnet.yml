name: Full Stack CI Pipeline

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  # ==========================================
  # SECURITY (SAST)
  # ==========================================
  security-scan:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Semgrep
        run: pip install semgrep
        
      - name: Semgrep Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/default
            p/csharp
            p/javascript
            p/typescript
            p/security-audit
            p/secrets
          generateSarif: "1"

      - name: Upload SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ==========================================
  # EPHEMERAL DAST (ZAP)
  # ==========================================
  zap-scan:
    name: ZAP Baseline Scan (CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Dummy .env for CI
        run: |
          echo "DB_USER=postgres" >> .env
          echo "DB_PASSWORD=postgres" >> .env
          echo "DB_NAME=ideahub_ci" >> .env
          echo "DB_HOST=ideahub-db" >> .env
          echo "DB_PORT=5432" >> .env
          echo "ASPNETCORE_ENVIRONMENT=Development" >> .env
          echo "JWT_KEY=0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF" >> .env
          echo "DOMAIN_URL=http://localhost:5065" >> .env
          echo "API_URL=http://localhost:5065/api" >> .env

      - name: Start Application (Docker Compose)
        run: |
          docker compose up -d --build

      - name: Wait for Health Check
        run: |
          # Give the DB and API time to start
          echo "Waiting for app to be ready..."
          sleep 40
          curl --fail --retry 10 --retry-delay 5 http://localhost:5065/health || (docker compose logs && exit 1)

      # No authentication needed here — this is an ephemeral CI environment.
      # The real authenticated ZAP scan runs in staging-deployment.yaml against
      # the live staging server using Auth0 ROPG.

      - name: Create ZAP Auth Hook (on-the-fly)
        run: |
          echo "def zap_started(zap, target):" > zap-hooks.py
          echo "    zap.openapi.import_url('http://localhost:5065/openapi/v1.json')" >> zap-hooks.py
          echo "" >> zap-hooks.py
          echo "def sending_request(zap, msg, is_sender_wildcard):" >> zap-hooks.py
          echo "    import os" >> zap-hooks.py
          echo "    token = os.environ.get('ZAP_AUTH_HEADER_VALUE')" >> zap-hooks.py
          echo "    if token:" >> zap-hooks.py
          echo "        msg.getRequestHeader().setHeader('Authorization', token)" >> zap-hooks.py
          echo "    return msg" >> zap-hooks.py

      - name: Run ZAP Baseline Scan (CI)
        # Unauthenticated baseline scan on the ephemeral CI environment.
        # Checks public endpoints and known vulnerability patterns.
        run: |
          touch zap_ci_report.html
          chmod 777 zap_ci_report.html
          docker run --rm --network="host" \
            -u root \
            -v $(pwd):/zap/wrk/:rw \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:5065 \
            -I \
            -c /zap/wrk/zap.conf \
            -r zap_ci_report.html \
            -J report_json.json

      - name: Upload ZAP HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-ci-report
          path: zap_ci_report.html

      - name: Convert ZAP JSON to SARIF
        if: always()
        run: |
          python3 - <<'EOF'
          import json, sys
          from urllib.parse import urlparse
          try:
              with open("report_json.json") as f:
                  zap = json.load(f)
          except FileNotFoundError:
              print("report_json.json not found — ZAP may not have completed. Writing empty SARIF.")
              zap = {"site": []}

          results = []
          for site in zap.get("site", []):
              for alert in site.get("alerts", []):
                  for instance in alert.get("instances", [{"uri": site.get("@name",""), "method":"","param":"","evidence":""}]):
                      raw_uri = instance.get("uri", "")
                      # GitHub Code Scanning requires relative file paths, not http:// URLs.
                      # Strip the scheme+host so "http://localhost:5065" becomes "/"
                      parsed = urlparse(raw_uri)
                      relative_uri = parsed.path.lstrip("/") or "index"
                      results.append({
                          "ruleId": str(alert.get("pluginid", "0")),
                          "message": {"text": alert.get("desc", alert.get("name", ""))},
                          "locations": [{"physicalLocation": {"artifactLocation": {"uri": relative_uri}}}],
                          "level": {"High":"error","Medium":"warning","Low":"note","Informational":"none"}.get(alert.get("riskdesc","").split(" ")[0], "none")
                      })

          sarif = {
              "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
              "version": "2.1.0",
              "runs": [{"tool": {"driver": {"name": "OWASP ZAP", "rules": []}}, "results": results}]
          }
          with open("results.sarif", "w") as f:
              json.dump(sarif, f, indent=2)
          print(f"SARIF written with {len(results)} results.")
          EOF

      - name: Upload ZAP Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
          category: zap

      - name: Stop Application
        if: always()
        run: docker compose down

  # ==========================================
  # FRONTEND
  # ==========================================
  frontend-ci:
    name: Node Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm install
        working-directory: ui

      - name: Check Formatting
        run: npm run format:check
        working-directory: ui

      - name: Lint & Static Analysis
        run: npm run lint
        working-directory: ui

      - name: Unit Tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless
        working-directory: ui

      - name: Integration Tests
        run: npm run test:integration
        working-directory: ui

  # ==========================================
  #.NET JOB
  # ==========================================
  backend-ci:
    name: .NET Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Install dependencies
        run: dotnet restore

      - name: Check Formatting
        # Fails the build if code deviates from .editorconfig styles
        run: dotnet format whitespace --verify-no-changes

      - name: Lint & Static Analysis (Analyzers)
        # Catches code smells and style violations
        run: dotnet format analyzers --verify-no-changes

      - name: Build with Strict Warnings
        # Compiles the code and treats warnings as errors to enforce strict static analysis
        run: dotnet build --no-restore -warnaserror

      - name: Unit Tests
        # Executes tests decorated with [Trait("Category", "Unit")]
        run: dotnet test --no-build --verbosity normal --filter "Category=Unit" --logger trx --results-directory "TestResults/Unit"

      - name: Integration Tests
        # Executes tests decorated with [Trait("Category", "Integration")]
        run: dotnet test --no-build --verbosity normal --filter "Category=Integration" --logger trx --results-directory "TestResults/Integration"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        # Ensures test results are published even if the tests fail
        if: ${{ always() }}
        with:
          name: dotnet-test-results
          path: TestResults